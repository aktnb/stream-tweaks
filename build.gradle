plugins {
    id 'base'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '7.2.1' apply false
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.142' apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    checkstyle {
        toolVersion = '10.26.1'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    spotless {
        java {
            target 'src/*/java/**/*.java', '../src/*/java/**/*.java'
            palantirJavaFormat('2.76.0').formatJavadoc(false)
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }

        format 'misc', {
            target '.editorconfig', '.gitignore', '*.md', '*.properties', '.github/workflows/*.yml'
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
            }
            withSourcesJar()
        }

        dependencies {
            testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
            testImplementation "org.mockito:mockito-core:5.17.0"
            testImplementation "org.mockito:mockito-junit-jupiter:5.17.0"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        }

        tasks.named('test', Test) {
            useJUnitPlatform()
            jvmArgs "-Dnet.bytebuddy.experimental=true"
        }
    }
}

tasks.register('format') {
    group = 'formatting'
    description = 'Formats source files with Spotless.'
    dependsOn subprojects.collect { it.tasks.named('spotlessApply') }
}

tasks.named('build') {
    dependsOn subprojects.collect { it.tasks.named('build') }
}
