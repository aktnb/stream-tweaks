name: Build

on:
  pull_request:
  push:
    branches:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # pull_request イベントで差分を取得する際に API アクセスが必要
      pull-requests: read
    outputs:
      fabric: ${{ steps.filter.outputs.fabric }}
      neoforge: ${{ steps.filter.outputs.neoforge }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            common: &common
              - 'src/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'config/checkstyle/**'
              - '.github/workflows/*.yml'
              - '.github/actions/**'
            fabric:
              - *common
              - 'fabric/**'
            neoforge:
              - *common
              - 'neoforge/**'

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Spotless Check
        run: ./gradlew spotlessCheck --stacktrace

  test:
    # テスト実体はルートの src/test/java（ローダー非依存の共通コード）にあり、
    # test タスクを持つのは fabric サブプロジェクトだけなので path filter の対象外として常時実行する。
    name: Test (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Run shared tests
        run: ./gradlew :fabric:test --stacktrace

  script-tests:
    name: Release Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compile release scripts
        run: python3 -m py_compile scripts/changelog_tool.py scripts/notify_discord.py

      - name: Run changelog tool tests
        run: python3 -m unittest discover scripts/tests

      - name: Check Discord notification payload
        run: >
          python3 scripts/notify_discord.py
          --status success
          --channel beta
          --tag v0.0.0-beta.1+mc26.2
          --mc 26.2
          --loaders both
          --notes-file /dev/null
          --dry-run

  build-fabric:
    name: Build Fabric
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.fabric == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      # test は Test (shared) ジョブで実行済みなので二重実行しない
      - name: Build Fabric artifact
        run: ./gradlew :fabric:build -x test --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: build-artifacts-fabric-${{ github.sha }}
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar
          retention-days: 7

  build-neoforge:
    name: Build NeoForge
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.neoforge == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Build NeoForge artifact
        run: ./gradlew :neoforge:build --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: build-artifacts-neoforge-${{ github.sha }}
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev.jar
          retention-days: 7

  ci-ok:
    # 唯一の必須ステータスチェック。path filter でスキップされたジョブは成功扱いにする。
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, format, test, script-tests, build-fabric, build-neoforge]
    steps:
      - name: Check job results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail

          echo "依存ジョブの結果: ${RESULTS}"

          FAILED=0
          IFS=',' read -r -a RESULT_LIST <<< "${RESULTS}"
          for result in "${RESULT_LIST[@]}"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "失敗またはキャンセルされたジョブがあります (result=${result})"
                FAILED=1
                ;;
            esac
          done

          exit "$FAILED"
