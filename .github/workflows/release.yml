name: Release
run-name: Release ${{ inputs.channel || 'manual' }} for ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      curseforge_project:
        description: '任意公開先の固定project ID（未設定ならGitHub/Modrinthのみ）'
        type: string
        required: false
      curseforge_required:
        description: '計画でCurseForge成功を必須にする（未指定なら任意先）'
        type: boolean
        default: false
      channel:
        description: 'alpha/beta は次番号を自動採番し、release は mod_version を使う'
        type: choice
        required: true
        options:
          - alpha
          - beta
          - release
      loaders:
        description: '固定するローダー集合（stable単Loaderも可、公開後追加不可）'
        type: choice
        required: true
        default: both
        options:
          - both
          - fabric
          - neoforge

concurrency:
  # Version assignment reads existing tags, so serialize the full release workflow per ref.
  group: release-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Compute fixed release plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.fixed-plan.outputs.source-sha }}
      release-version: ${{ steps.fixed-plan.outputs.version }}
      plan-artifact: ${{ steps.fixed-plan.outputs.plan-artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: fixed-plan
        name: Compute fixed plan
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          LOADERS: ${{ inputs.loaders }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURSEFORGE_PROJECT: ${{ inputs.curseforge_project }}
          CURSEFORGE_REQUIRED: ${{ inputs.curseforge_required }}
        run: |
          set -euo pipefail
          case "$LOADERS" in
            both) LOADER_ARGS=(--loader fabric --loader neoforge) ;;
            fabric|neoforge) LOADER_ARGS=(--loader "$LOADERS") ;;
            *) exit 1 ;;
          esac
          if [[ "$SOURCE_REF" != refs/heads/main ]]; then
            echo 'release-new は main branch ref からのみ実行できます' >&2
            exit 1
          fi
          BASE_VERSION="$(sed -nE 's/^mod_version=([^[:space:]#]+).*$/\1/p' gradle.properties)"
          MC_VERSION="$(sed -nE 's/^minecraft_version=([^[:space:]#]+).*$/\1/p' gradle.properties)"
          VERSION="$(python3 scripts/release_version.py --base "$BASE_VERSION" \
            --minecraft "$MC_VERSION" --channel "$CHANNEL")"
          PLAN_ARGS=(new --version "$VERSION" --minecraft "$MC_VERSION" --channel "$CHANNEL"
            --source-branch "$SOURCE_BRANCH" --source-sha "$SOURCE_SHA"
            --properties gradle.properties "${LOADER_ARGS[@]}" --output "$RUNNER_TEMP/release-plan.json")
          if [[ -n "$CURSEFORGE_PROJECT" ]]; then PLAN_ARGS+=(--curseforge-project "$CURSEFORGE_PROJECT"); fi
          if [[ "$CURSEFORGE_REQUIRED" == true ]]; then PLAN_ARGS+=(--curseforge-required); fi
          python3 scripts/release_plan.py "${PLAN_ARGS[@]}"
          printf 'source-sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'plan-artifact=release-plan-%s-%s-attempt-%s\n' \
            "$RELEASE_RUN_ID" "$SOURCE_SHA" "$RELEASE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf '選択チャンネル: `%s`\n割り当てバージョン: `%s`\n' \
            "$CHANNEL" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo '固定計画を作成しました。' >> "$GITHUB_STEP_SUMMARY"

      - name: Save fixed plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.fixed-plan.outputs.plan-artifact }}
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 7

  bundle-build:
    name: Build immutable release bundle
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.bundle.outputs.manifest-sha256 }}
      bundle-artifact: ${{ steps.bundle.outputs.bundle-artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          persist-credentials: false

      - name: Download this run's fixed plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.plan.outputs.plan-artifact }}
          path: ${{ runner.temp }}/fixed-plan

      - uses: ./.github/actions/setup-build

      - id: build-inputs
        name: Validate fixed checkout and build inputs
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import release_plan
          plan = release_plan.load_plan(pathlib.Path(os.environ['RUNNER_TEMP']) / 'fixed-plan/release-plan.json')
          if plan['source_sha'] != os.environ['EXPECTED_SOURCE_SHA']:
              raise SystemExit('Fixed plan source SHA mismatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('version=' + plan['mod_version'] + '\n')
              stream.write('loaders=' + ','.join(row['loader'] for row in plan['targets']) + '\n')
          PY

      - name: Build and check every selected target, then record resolved inputs
        shell: bash
        env:
          VERSION: ${{ steps.build-inputs.outputs.version }}
          LOADERS: ${{ steps.build-inputs.outputs.loaders }}
        run: |
          set -euo pipefail
          case "$LOADERS" in
            fabric) BUILD_TASKS=(:fabric:build) ;;
            neoforge) BUILD_TASKS=(:neoforge:build) ;;
            fabric,neoforge) BUILD_TASKS=(:fabric:build :neoforge:build) ;;
            *) exit 1 ;;
          esac
          # One task graph deduplicates :fabric:test even when :fabric:build also requires it.
          ./gradlew clean :fabric:test "${BUILD_TASKS[@]}" writeReleaseProvenance \
            -I scripts/release-provenance.gradle --dependency-verification=strict --stacktrace \
            "-Pmod_version=$VERSION" "-PreleaseLoaders=$LOADERS" \
            "-PreleaseProvenanceOutput=$RUNNER_TEMP/resolved-provenance.json"

      - id: bundle
        name: Validate JARs and save immutable bundle
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/release_bundle.py create \
            --plan "$RUNNER_TEMP/fixed-plan/release-plan.json" --source-sha "$EXPECTED_SOURCE_SHA" \
            --resolved-provenance "$RUNNER_TEMP/resolved-provenance.json" \
            --output "$RUNNER_TEMP/release-bundle" --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" --repository "$RELEASE_REPOSITORY" \
            > "$RUNNER_TEMP/bundle-create-result.json"
          python3 scripts/release_bundle.py verify \
            --bundle "$RUNNER_TEMP/release-bundle" --source-sha "$EXPECTED_SOURCE_SHA" \
            --plan "$RUNNER_TEMP/fixed-plan/release-plan.json" > "$RUNNER_TEMP/bundle-verify-result.json"
          python3 - <<'PY'
          import hashlib, os, pathlib
          manifest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-bundle/release-manifest.json'
          digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          artifact = 'release-bundle-' + os.environ['RELEASE_RUN_ID'] + '-' + os.environ['EXPECTED_SOURCE_SHA']
          artifact += '-attempt-' + os.environ['RELEASE_RUN_ATTEMPT']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('manifest-sha256=' + digest + '\n')
              stream.write('bundle-artifact=' + artifact + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('Bundle verified and ready for GitHub draft staging. Manifest SHA256: `' + digest + '`\n')
          PY

      - name: Save validated bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.bundle.outputs.bundle-artifact }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 30

  github-inputs:
    name: Verify GitHub staging identity (read only)
    needs: [plan, bundle-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      source-sha: ${{ steps.identity.outputs.source-sha }}
      manifest-sha256: ${{ steps.identity.outputs.manifest-sha256 }}
      expected-identity: ${{ steps.identity.outputs.expected-identity }}
      bundle-artifact: ${{ steps.identity.outputs.bundle-artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download this run's release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.bundle-build.outputs.bundle-artifact }}
          path: ${{ runner.temp }}/release-bundle

      - id: identity
        name: Validate immutable publication inputs
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.release-version }}
          CHANNEL: ${{ inputs.channel }}
          LOADERS: ${{ inputs.loaders }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_REF: ${{ github.ref }}
          CURSEFORGE_PROJECT: ${{ inputs.curseforge_project }}
          CURSEFORGE_REQUIRED: ${{ inputs.curseforge_required }}
          PLAN_RESULT: ${{ needs.plan.result }}
          BUNDLE_BUILD_RESULT: ${{ needs.bundle-build.result }}
          BUNDLE_BUILD_MANIFEST_SHA256: ${{ needs.bundle-build.outputs.manifest-sha256 }}
          BUNDLE_BUILD_ARTIFACT: ${{ needs.bundle-build.outputs.bundle-artifact }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          MANIFEST_SHA256: ${{ needs.bundle-build.outputs.manifest-sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          sys.path.insert(0, 'scripts')
          import release_bundle as rb, release_plan as rp, validate_targets as vt
          env = os.environ
          if env['PLAN_RESULT'] != 'success' or env['BUNDLE_BUILD_RESULT'] != 'success':
              raise SystemExit('release-new requires a successful fixed plan and bundle build')
          if env['SOURCE_BRANCH'] != 'main':
              raise SystemExit('release-new must use the main publication source')
          if env['SOURCE_REF'] != 'refs/heads/main':
              raise SystemExit('release-new must use the main branch ref')
          if env['MANIFEST_SHA256'] != env['BUNDLE_BUILD_MANIFEST_SHA256']:
              raise SystemExit('release-new bundle manifest output mismatch')
          if not re.fullmatch('[0-9a-f]{64}', env['MANIFEST_SHA256']):
              raise SystemExit('release-new manifest SHA256 is missing or invalid')
          bundle_dir = pathlib.Path(env['RUNNER_TEMP']) / 'release-bundle'
          manifest_path = bundle_dir / rb.MANIFEST
          digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          if digest != env['MANIFEST_SHA256']:
              raise SystemExit('release-new downloaded manifest hash mismatch')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'), object_pairs_hook=vt._unique_object)
          plan = rp.validate_plan(manifest['plan'])
          workflow = manifest['provenance']['workflow']
          if (workflow['repository'] != env['REPOSITORY'] or workflow['run_id'] != env['RUN_ID']
                  or int(workflow['run_attempt']) > int(env['RUN_ATTEMPT'])):
              raise SystemExit('release-new bundle provenance does not match this workflow run')
          if plan['source_sha'] != env['SOURCE_SHA'] or plan['source_branch'] != env['SOURCE_BRANCH']:
              raise SystemExit('release-new bundle source identity mismatch')
          loaders = ['fabric', 'neoforge'] if env['LOADERS'] == 'both' else [env['LOADERS']]
          identity = dict(version=env['VERSION'], minecraft=plan['minecraft'], channel=env['CHANNEL'],
              source_branch=env['SOURCE_BRANCH'], source_sha=env['SOURCE_SHA'],
              loaders=rp.normalize_loaders(loaders), curseforge_project=env['CURSEFORGE_PROJECT'] or None,
              curseforge_required=env['CURSEFORGE_REQUIRED'] == 'true')
          expected_plan = rp.reuse_plan(plan, **identity)
          rb.verify_bundle(bundle_dir, expected_source_sha=env['SOURCE_SHA'], expected_plan=expected_plan,
              expected_manifest_sha256=env['MANIFEST_SHA256'])
          tag = expected_plan['tag']
          bundle_artifact = env['BUNDLE_BUILD_ARTIFACT']
          expected_identity = json.dumps(identity, ensure_ascii=False, separators=(',', ':'))
          with open(env['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('tag=' + tag + '\n')
              stream.write('source-sha=' + env['SOURCE_SHA'] + '\n')
              stream.write('manifest-sha256=' + env['MANIFEST_SHA256'] + '\n')
              stream.write('expected-identity=' + expected_identity + '\n')
              stream.write('bundle-artifact=' + bundle_artifact + '\n')
          PY

  github-stage:
    name: Store verified bundle in GitHub draft
    needs: [github-inputs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.github-inputs.outputs.tag }}
      source-sha: ${{ needs.github-inputs.outputs.source-sha }}
      manifest-sha256: ${{ needs.github-inputs.outputs.manifest-sha256 }}
    concurrency:
      group: release-${{ needs.github-inputs.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download this run's verified build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.github-inputs.outputs.bundle-artifact }}
          path: ${{ runner.temp }}/github-bundle
      - name: Verify bundle and stage missing assets only
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.github-inputs.outputs.source-sha }}
          MANIFEST_SHA256: ${{ needs.github-inputs.outputs.manifest-sha256 }}
          TAG: ${{ needs.github-inputs.outputs.tag }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          EXPECTED_IDENTITY: ${{ needs.github-inputs.outputs.expected-identity }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release_bundle.py verify --bundle "$RUNNER_TEMP/github-bundle" \
            --source-sha "$SOURCE_SHA" --manifest-sha256 "$MANIFEST_SHA256" > "$RUNNER_TEMP/github-verify-result.json"
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import release_plan as rp
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads((root / 'github-bundle/release-manifest.json').read_text())
          identity = json.loads(os.environ['EXPECTED_IDENTITY'])
          plan = rp.reuse_plan(manifest['plan'], **identity)
          workflow = manifest['provenance']['workflow']
          if (workflow['repository'] != os.environ['RELEASE_REPOSITORY']
                  or workflow['run_id'] != os.environ['RELEASE_RUN_ID']
                  or int(workflow['run_attempt']) > int(os.environ['RELEASE_RUN_ATTEMPT'])):
              raise SystemExit('Bundle provenance attempt/repository mismatch')
          (root / 'github-expected-plan.json').write_text(rp.canonical_json(plan))
          PY
          python3 scripts/publish_github.py stage --bundle "$RUNNER_TEMP/github-bundle" \
            --source-sha "$SOURCE_SHA" --manifest-sha256 "$MANIFEST_SHA256" \
            --plan "$RUNNER_TEMP/github-expected-plan.json" \
            --state-output "$RUNNER_TEMP/publish-state.json" > "$RUNNER_TEMP/github-stage-result.json"
          {
            echo "GitHub draft staged: \`$TAG\`"
            echo "Source SHA: \`$SOURCE_SHA\`"
            echo "Manifest SHA256: \`$MANIFEST_SHA256\`"
            echo 'Publish waits for the release-publish Environment approval.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize publication state
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          state = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publish-state.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not state.exists():
                  summary.write('Publication stopped before a state snapshot was available.\n')
              else:
                  value = json.loads(state.read_text())
                  summary.write('GitHub: ' + value['github']['status'] + '\n')
                  for target, destinations in value.get('targets', {}).items():
                      for name, receipt in destinations.items():
                          summary.write(target + ' / ' + name + ': ' + receipt['status'] + '\n')
          PY
      - name: Save separate publication state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage-state-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-state.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish ${{ needs.github-stage.outputs.tag }}
    needs: [github-inputs, github-stage]
    runs-on: ubuntu-latest
    environment:
      name: release-publish
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.github-stage.outputs.tag }}
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.github-stage.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore the staged draft bundle after approval
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.github-stage.outputs.source-sha }}
          MANIFEST_SHA256: ${{ needs.github-stage.outputs.manifest-sha256 }}
          TAG: ${{ needs.github-stage.outputs.tag }}
          EXPECTED_IDENTITY: ${{ needs.github-inputs.outputs.expected-identity }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/publish_github.py restore --tag "$TAG" --source-sha "$SOURCE_SHA" \
            --manifest-sha256 "$MANIFEST_SHA256" --output "$RUNNER_TEMP/github-bundle" \
            > "$RUNNER_TEMP/github-restore-result.json"
          python3 scripts/release_bundle.py verify --bundle "$RUNNER_TEMP/github-bundle" \
            --source-sha "$SOURCE_SHA" --manifest-sha256 "$MANIFEST_SHA256" \
            > "$RUNNER_TEMP/github-verify-result.json"
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import release_plan as rp
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads((root / 'github-bundle/release-manifest.json').read_text())
          identity = json.loads(os.environ['EXPECTED_IDENTITY'])
          plan = rp.reuse_plan(manifest['plan'], **identity)
          (root / 'github-expected-plan.json').write_text(rp.canonical_json(plan))
          PY

      - id: publish
        name: Reconcile missing destinations and finalize verified release
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.github-stage.outputs.source-sha }}
          MANIFEST_SHA256: ${{ needs.github-stage.outputs.manifest-sha256 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/publish_modrinth.py publish --bundle "$RUNNER_TEMP/github-bundle" \
            --source-sha "$SOURCE_SHA" --manifest-sha256 "$MANIFEST_SHA256" \
            --state-output "$RUNNER_TEMP/publish-state.json" > "$RUNNER_TEMP/publish-result.json"

      - name: Notify completed publication
        if: ${{ steps.publish.outcome == 'success' }}
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then exit 0; fi
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          result = json.loads((root / 'publish-result.json').read_text())
          if result['github']['status'] != 'published':
              raise SystemExit('Release is not finalized')
          plan = json.loads((root / 'github-bundle/release-plan.json').read_text())
          subprocess.run([sys.executable, 'scripts/notify_discord.py', '--status', 'success', '--channel', plan['channel'],
              '--tag', plan['tag'], '--mc', plan['minecraft'], '--loaders', ','.join(t['loader'] for t in plan['targets']),
              '--notes-file', str(root / 'github-bundle/notes-combined.md'), '--run-url', os.environ['RUN_URL']], check=True)
          PY

      - name: Summarize publication state
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          state = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publish-state.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not state.exists():
                  summary.write('Publication stopped before a state snapshot was available.\n')
              else:
                  value = json.loads(state.read_text())
                  summary.write('GitHub: ' + value['github']['status'] + '\n')
                  for target, destinations in value.get('targets', {}).items():
                      for name, receipt in destinations.items():
                          summary.write(target + ' / ' + name + ': ' + receipt['status'] + '\n')
          PY

      - name: Save separate publication state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-state-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-state.json
          if-no-files-found: warn
          retention-days: 30
