modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/aktnb/stream-tweaks-mod-0/issues"

[[mods]]
modId = "${neoforge_mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "etwas"
description = '''
A client-side mod that displays Twitch chat directly in Minecraft.
'''
logoFile = "assets/stream-tweaks/icon.png"
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "stream-tweaks.mixins.json"

[[dependencies.${neoforge_mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${neoforge_mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "CLIENT"
