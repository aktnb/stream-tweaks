pluginManagement {
    resolutionStrategy {
        eachPlugin {
            def version = requested.version
            if (version != null && (version.toUpperCase().contains('SNAPSHOT')
                    || version.contains('+') || version.startsWith('latest.')
                    || version.contains('[') || version.contains('('))) {
                throw new GradleException("Plugin version must be immutable: ${requested}")
            }
        }
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_PROJECT
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases/"
        }
    }
}

rootProject.name = 'stream-tweaks'
include 'fabric', 'neoforge'
